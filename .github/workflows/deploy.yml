name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    # DATABASE_URL dummy: `prisma generate` (via postinstall) hanya butuh
    # variabelnya ada, tidak butuh koneksi DB live.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # jsdom 30 (test komponen) butuh API yang hanya ada di Node 22+.
          # Samakan dengan versi dev lokal yang terverifikasi hijau.
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - run: npx prettier --check .
      - run: npm run build
